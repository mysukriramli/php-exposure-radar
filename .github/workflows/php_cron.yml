name: PHP Exposure Radar Cron

on:
  schedule:
    # Runs every 6 hours at minute 26 (off-peak)
    - cron: '26 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests pydantic

      - name: Execute PHP Radar Engine
        run: |
          python3 main.py

      - name: Commit and push updates
        run: |
          git config user.name "php-radar-bot[bot]"
          git config user.email "php-radar-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No changes in PHP exposure matrix. Skipping commit."
          else
            git commit -m "chore(php): update PHP runtime vulnerability radar [skip ci]"
            git push origin main
          fi
